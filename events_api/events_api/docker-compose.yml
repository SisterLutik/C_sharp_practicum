services:
  # ============================================
  # Kafka (KRaft, без Zookeeper)
  # ============================================
  kafka:
    image: apache/kafka:latest
    container_name: events-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ============================================
  # PostgreSQL — один инстанс, три базы
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: events-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # UserService
  # ============================================
  user-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PROJECT: src/UserService/UserService.Presentation/UserService.Presentation.csproj
    container_name: events-user-service
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=users_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    entrypoint: ["dotnet", "UserService.Presentation.dll"]
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================
  # EventService
  # ============================================
  event-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PROJECT: src/EventService/EventService.Presentation/EventService.Presentation.csproj
    container_name: events-event-service
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=events_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
      Kafka__ConsumerGroup: event-service
    entrypoint: ["dotnet", "EventService.Presentation.dll"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ============================================
  # BookingService
  # ============================================
  booking-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PROJECT: src/BookingService/BookingService.Presentation/BookingService.Presentation.csproj
    container_name: events-booking-service
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=bookings_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
      Services__EventService__BaseUrl: "http://event-service:8080"
    entrypoint: ["dotnet", "BookingService.Presentation.dll"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      event-service:
        condition: service_started

volumes:
  postgres-data: